<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Metro Sathi | Bengaluru Metro Companion</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#00210b",
                    "on-error": "#ffffff",
                    "surface-container": "#e6eeff",
                    "secondary-fixed": "#8afaa6",
                    "on-surface": "#121c2a",
                    "outline": "#7e7481",
                    "surface-bright": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "secondary": "#006d34",
                    "background": "#f8f9ff",
                    "surface-variant": "#d9e3f6",
                    "secondary-container": "#8afaa6",
                    "on-tertiary-fixed": "#001e2d",
                    "tertiary-container": "#005171",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#dee9fc",
                    "inverse-on-surface": "#eaf1ff",
                    "inverse-surface": "#27313f",
                    "primary-container": "#6a2e91",
                    "surface": "#f8f9ff",
                    "on-surface-variant": "#4d4450",
                    "tertiary-fixed-dim": "#80d0ff",
                    "outline-variant": "#cfc2d2",
                    "on-tertiary-fixed-variant": "#004c6a",
                    "surface-dim": "#d0dbed",
                    "tertiary": "#003951",
                    "on-tertiary-container": "#5cc6ff",
                    "primary": "#511078",
                    "inverse-primary": "#e4b5ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#eff4ff",
                    "on-primary-fixed-variant": "#65298c",
                    "on-error-container": "#93000a",
                    "on-primary-container": "#dda6ff",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#007438",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#005226",
                    "on-background": "#121c2a",
                    "surface-container-highest": "#d9e3f6",
                    "primary-fixed": "#f4d9ff",
                    "secondary-fixed-dim": "#6edd8c",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#7f43a6",
                    "tertiary-fixed": "#c5e7ff",
                    "primary-fixed-dim": "#e4b5ff",
                    "on-primary-fixed": "#2f004c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "base": "4px",
                    "margin-desktop": "64px",
                    "max-width": "1280px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-xl": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]

          },
        },
      }

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden min-h-screen flex flex-col pt-16">

    <!-- Top Navigation Bar -->
    <header id="global-header" class="fixed top-0 w-full z-50 bg-surface dark:bg-on-surface border-b border-outline-variant dark:border-surface-variant">
        <div class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop max-w-max-width mx-auto">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🚇</span>
                <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Metro Sathi</span>
            </div>
            <nav class="hidden md:flex items-center gap-8 ml-auto mr-8">
                <a class="font-label-md nav-link-tab" id="nav-link-home" href="/home">Home</a>
                <a class="font-label-md nav-link-tab" id="nav-link-lines" href="/metro-lines">Metro Line</a>
                <a class="font-label-md nav-link-tab" id="nav-link-tickets" href="/buy-tickets">Buy Ticket</a>
            </nav>
        </div>
    </header>

    <!-- Chat Header (visible only when chat is active) -->
    <header id="chat-header" class="w-full top-0 bg-surface-container-lowest border-b border-outline-variant z-50 sticky hidden">
        <div class="flex justify-between items-center px-gutter py-4 max-w-max-width mx-auto">
            <button id="chat-header-back-btn" class="flex items-center gap-2 text-primary hover:opacity-80 transition-opacity cursor-pointer border-none bg-transparent">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="font-label-md">Back</span>
            </button>
        </div>
    </header>

    <!-- App Content Target for Dynamic Routing View Injection -->
    <main id="app-content" class="flex-grow w-full">
        <!-- Views are dynamically loaded and injected here -->
    </main>

    <!-- Global Footer -->
    <footer id="global-footer" class="w-full mt-auto bg-surface-container-low border-t border-outline-variant">
        <div class="flex flex-col md:flex-row justify-between items-center py-8 px-margin-mobile md:px-margin-desktop max-w-max-width mx-auto gap-6 md:gap-0">
            <div class="flex flex-col md:items-start items-center gap-2">
                <span class="font-headline-md text-headline-md font-bold text-on-surface">Metro Sathi</span>
                <p class="font-body-md text-body-md text-on-surface-variant">© 2024 Metro Sathi Bengaluru. All rights reserved.</p>
            </div>
            <div class="flex flex-wrap justify-center gap-6 md:gap-8">
                <a class="text-on-surface-variant hover:underline decoration-primary transition-all duration-200 font-body-md" href="#">Privacy Policy</a>
                <a class="text-on-surface-variant hover:underline decoration-primary transition-all duration-200 font-body-md" href="#">Terms of Service</a>
                <a class="text-on-surface-variant hover:underline decoration-primary transition-all duration-200 font-body-md" href="#">Contact Support</a>
                <a class="text-on-surface-variant hover:underline decoration-primary transition-all duration-200 font-body-md" href="#">Feedback</a>
            </div>
        </div>
    </footer>

    <!-- Chat Footer (visible only when chat is active) -->
    <footer id="chat-footer" class="w-full bg-surface-container-low border-t border-outline-variant mt-12 hidden">
        <div class="max-w-max-width mx-auto px-gutter py-8 text-center">
            <p class="font-label-sm text-label-sm text-on-surface-variant opacity-60">
                Made with ♥ for Bengaluru commuters. Always check official Namma Metro timings before travel.
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/metro-data.js"></script>
    <script src="js/gps-tracker.js"></script>
    <script src="js/route-finder.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
